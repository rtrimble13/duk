name: duk-dev
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version requirement  
  - python>=3.8
  
  # Core dependencies from pyproject.toml
  - requests>=2.25.0
  - pandas>=1.3.0
  - click>=8.0.0
  - python-dateutil>=2.8.0
  - scipy>=1.7.0
  
  # Development dependencies
  - pytest>=6.0
  - pytest-cov>=2.0
  - black>=21.0
  - flake8>=3.8
  - build>=0.7.0
  
  # Additional conda-specific development tools
  - conda-build
  - pip